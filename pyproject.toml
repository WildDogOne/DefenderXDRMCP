[project]
name = "defender-xdr-mcp"
version = "0.1.0"
description = "MCP server for Microsoft Defender XDR (Incidents + Advanced Hunting), generated from Microsoft's own Graph Security API OpenAPI spec"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx2",
    "msal>=1.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
defender-xdr-mcp = "defender_xdr_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defender_xdr_mcp"]
